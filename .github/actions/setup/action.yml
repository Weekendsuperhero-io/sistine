name: Setup
description: Install bun and the project dependencies (frozen lockfile).

# Mirrors the toolchain pinned in refresh-registry.yml so every workflow installs identically.
# Node is still installed because the theme checks run under `node --experimental-strip-types`,
# which is what type-strips the .ts files they import.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - run: bun install --frozen-lockfile
      shell: bash
